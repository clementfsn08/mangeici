<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MANGEICI — Connexion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FAFAF7;--cream:#F5F0E8;--sand:#EDE8DF;--sand-2:#E2DDD3;
  --stone:#D4CFC4;--warm-gray:#9C978E;--dark:#2C2A26;--dark-2:#4A4740;--ink:#1A1816;
  --orange:#E85D20;--orange-light:rgba(232,93,32,.1);--orange-border:rgba(232,93,32,.25);
  --gold:#C4933A;--gold-light:rgba(196,147,58,.12);
  --green:#3A7D44;--green-light:rgba(58,125,68,.1);--green-border:rgba(58,125,68,.25);
  --red:#C0392B;--red-light:rgba(192,57,43,.1);--red-border:rgba(192,57,43,.25);
  --font-d:'Playfair Display',Georgia,serif;
  --font-b:'Plus Jakarta Sans',system-ui,sans-serif;
  --shadow-sm:0 1px 3px rgba(44,42,38,.08),0 4px 12px rgba(44,42,38,.06);
  --shadow:0 4px 16px rgba(44,42,38,.1),0 12px 40px rgba(44,42,38,.08);
  --shadow-lg:0 8px 32px rgba(44,42,38,.12),0 32px 80px rgba(44,42,38,.1);
  --radius:18px;--rsm:10px;--rxs:7px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--dark);font-family:var(--font-b);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--orange);color:white}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--sand)}
::-webkit-scrollbar-thumb{background:var(--stone);border-radius:3px}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(250,250,247,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--sand-2)}
.nav-logo{font-family:var(--font-d);font-size:21px;font-weight:700;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:9px}
.nav-logo-mark{width:32px;height:32px;background:var(--orange);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 3px 10px rgba(232,93,32,.3)}
.nav-logo em{color:var(--orange);font-style:normal}
.nav-back{font-size:13px;color:var(--warm-gray);text-decoration:none;transition:color .2s;display:flex;align-items:center;gap:5px}
.nav-back:hover{color:var(--orange)}
.field{margin-bottom:16px}
.field label{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--cream);border:1px solid var(--sand-2);color:var(--dark);font-family:var(--font-b);font-size:14px;font-weight:400;padding:12px 15px;border-radius:var(--rxs);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{background:white;border-color:var(--orange-border);box-shadow:0 0 0 3px rgba(232,93,32,.08)}
.field input::placeholder,.field textarea::placeholder{color:var(--stone);font-style:italic}
.field textarea{min-height:100px;resize:vertical;line-height:1.6}
.btn{background:var(--orange);color:white;border:none;font-family:var(--font-b);font-size:14px;font-weight:700;padding:13px 24px;border-radius:100px;cursor:pointer;transition:all .25s;box-shadow:0 3px 12px rgba(232,93,32,.3);letter-spacing:.01em}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 18px rgba(232,93,32,.42)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{padding:12px 16px;border-radius:var(--rxs);font-size:13px;margin:10px 0;display:none;line-height:1.5}
.msg.ok{background:var(--green-light);border:1px solid var(--green-border);color:var(--green);display:block}
.msg.ko{background:var(--red-light);border:1px solid var(--red-border);color:var(--red);display:block}
.scroll-top{position:fixed;bottom:28px;right:28px;width:42px;height:42px;border-radius:50%;background:var(--ink);border:none;color:var(--ivory);font-size:17px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:99;transition:all .2s}
.scroll-top:hover{background:var(--orange);transform:translateY(-2px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s ease}
.reveal.vis{opacity:1;transform:translateY(0)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(circle at 20% 20%,rgba(232,93,32,.06) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(196,147,58,.05) 0%,transparent 50%);pointer-events:none}
body::after{content:"";position:fixed;background-image:radial-gradient(circle,rgba(44,42,38,.06) 1px,transparent 1px);background-size:28px 28px;inset:0;pointer-events:none;mask-image:radial-gradient(ellipse 80% 80% at center,black 30%,transparent 100%)}
.card{width:100%;max-width:420px;background:white;border:1px solid var(--sand-2);border-radius:24px;padding:40px;box-shadow:var(--shadow-lg);animation:fadeUp .5s ease both;position:relative;z-index:2}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:24px 24px 0 0}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;text-decoration:none;color:var(--ink)}
.logo-mark{width:38px;height:38px;background:var(--orange);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 12px rgba(232,93,32,.3)}
.logo-text{font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:-.02em}
.logo-text em{color:var(--orange);font-style:normal}
.tabs{display:flex;background:var(--cream);border-radius:100px;padding:4px;margin-bottom:22px;border:1px solid var(--sand-2)}
.tab{flex:1;padding:9px;border-radius:100px;font-family:var(--font-b);font-size:13px;font-weight:600;cursor:pointer;color:var(--warm-gray);transition:all .25s;text-align:center;border:none;background:none}
.tab.active{background:var(--orange);color:white;box-shadow:0 3px 12px rgba(232,93,32,.3)}
.panel{display:none}.panel.active{display:block}
.forgot{font-size:12px;color:var(--warm-gray);text-align:right;margin-top:5px;cursor:pointer;transition:color .2s;text-decoration:underline;text-underline-offset:2px}
.forgot:hover{color:var(--orange)}
.btn-full{width:100%}
.btn-ghost{width:100%;background:transparent;border:1px solid var(--sand-2);color:var(--warm-gray);font-family:var(--font-b);font-size:14px;font-weight:500;padding:12px;border-radius:100px;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-ghost:hover{border-color:var(--orange-border);color:var(--orange)}
#new-pass-section{display:none}
.bottom-link{text-align:center;margin-top:20px;font-size:13px;color:var(--warm-gray);position:relative;z-index:2}
.bottom-link a{color:var(--orange);text-decoration:none;font-weight:600}
.nav-back-fixed{position:fixed;top:20px;left:24px;font-size:13px;color:var(--warm-gray);text-decoration:none;transition:color .2s;z-index:10;display:flex;align-items:center;gap:5px}
.nav-back-fixed:hover{color:var(--orange)}
</style>
</head>
<body>
<a class="nav-back-fixed" href="mangeici-mvp.html">← Retour au site</a>
<div class="card">
  <a class="logo" href="mangeici-mvp.html">
    <div class="logo-mark">🍽️</div>
    <div class="logo-text">MANGE<em>ICI</em></div>
  </a>
  <div id="new-pass-section">
    <div style="font-family:var(--font-d);font-size:18px;font-weight:700;color:var(--ink);margin-bottom:6px">🔑 Nouveau mot de passe</div>
    <div style="font-size:13px;color:var(--warm-gray);margin-bottom:20px">Choisis un nouveau mot de passe sécurisé.</div>
    <div class="field"><label>Nouveau mot de passe</label><input type="password" id="new-pass" placeholder="8 caractères min"></div>
    <div class="field"><label>Confirmer</label><input type="password" id="new-pass2" placeholder="Même mot de passe"></div>
    <div class="msg" id="new-pass-msg"></div>
    <button class="btn btn-full" onclick="updatePassword()">✓ Mettre à jour</button>
  </div>
  <div id="main-section">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Se connecter</button>
      <button class="tab" id="tab-reset" onclick="switchTab('reset')">Mot de passe oublié</button>
    </div>
    <div class="panel active" id="panel-login">
      <div class="msg" id="login-msg"></div>
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="ton@email.com"></div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
        <div class="forgot" onclick="switchTab('reset')">Mot de passe oublié ?</div>
      </div>
      <button class="btn btn-full" id="btn-login" onclick="doLogin()">Se connecter →</button>
      <button class="btn-ghost" onclick="location.href='mangeici-inscription.html'">Pas encore inscrit ? Créer un compte</button>
    </div>
    <div class="panel" id="panel-reset">
      <div style="font-size:13px;color:var(--warm-gray);margin-bottom:18px;line-height:1.6">Entre ton email pour recevoir un lien de réinitialisation.</div>
      <div class="msg" id="reset-msg"></div>
      <div class="field"><label>Email</label><input type="email" id="reset-email" placeholder="ton@email.com" onkeydown="if(event.key==='Enter')doReset()"></div>
      <button class="btn btn-full" id="btn-reset" onclick="doReset()">📧 Envoyer le lien</button>
      <button class="btn-ghost" onclick="switchTab('login')">← Retour à la connexion</button>
    </div>
  </div>
</div>
<div class="bottom-link">Nouveau restaurant ? <a href="mangeici-inscription.html">Inscrire mon resto →</a></div>
<script>



const SUPA_URL = "https://ldcweouzknksuudvroqu.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkY3dlb3V6a25rc3V1ZHZyb3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMDA0NjAsImV4cCI6MjA5MTY3NjQ2MH0.vyCqou8IAugFszrizK0eVRu3G2HylNKZmEp8vn0oKoE";

const { createClient } = supabase;
const db = createClient(SUPA_URL, SUPA_KEY);

// Rediriger si déjà connecté
db.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'mangeici-dashboard.html';
});

function showTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('tab-reset').style.display = tab === 'reset' ? 'block' : 'none';
}

function showMsg(id, type, text) {
  const el = document.getElementById(id);
  el.className = `msg ${type}`;
  el.textContent = text;
  el.style.display = 'block';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const btn   = document.getElementById('btn-login');

  if (!email || !pass) { showMsg('login-msg','ko','⚠️ Remplis les deux champs.'); return; }

  btn.disabled = true; btn.textContent = '⏳ Connexion…';

  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });

  if (error) {
    btn.disabled = false; btn.textContent = '🔓 Accéder à mon dashboard';
    const msg = error.message.includes('Invalid') ? '❌ Email ou mot de passe incorrect.' : '❌ ' + error.message;
    showMsg('login-msg', 'ko', msg);
    return;
  }

  showMsg('login-msg', 'ok', '✅ Connexion réussie ! Redirection…');
  setTimeout(() => window.location.href = 'mangeici-dashboard.html', 800);
}

async function doReset() {
  const email = document.getElementById('reset-email').value.trim();
  const btn   = document.getElementById('btn-reset');

  if (!email) { showMsg('reset-msg','ko','⚠️ Entre ton email.'); return; }

  btn.disabled = true; btn.textContent = '⏳ Envoi…';

  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/mangeici-login.html'
  });

  btn.disabled = false; btn.textContent = '📧 Envoyer le lien';

  if (error) { showMsg('reset-msg','ko','❌ ' + error.message); return; }
  showMsg('reset-msg','ok','✅ Email envoyé ! Vérifie ta boîte mail (et les spams).');
}

// Détecter le retour depuis le lien de réinitialisation du mot de passe
(function() {
  // Supabase envoie les params dans le HASH (#) OU en query string (?)
  var hash   = window.location.hash.substring(1);
  var search = window.location.search.substring(1);
  var raw    = hash || search;

  var params = {};
  raw.split('&').forEach(function(part) {
    var kv = part.split('=');
    if (kv[0]) params[kv[0]] = decodeURIComponent((kv[1] || '').replace(/\+/g,' '));
  });

  // Réinitialisation mot de passe
  if (params.type === 'recovery' && params.access_token) {
    window.history.replaceState({}, document.title, window.location.pathname);
    showNewPasswordForm(params.access_token);
    return;
  }

  // Confirmation d'email signup
  if (params.type === 'signup' || params.type === 'magiclink') {
    window.history.replaceState({}, document.title, window.location.pathname);
    showMsg('login-msg', 'ok', '✅ Email confirmé ! Vous pouvez vous connecter maintenant.');
    return;
  }

  // Fallback: hash contains access_token (older Supabase format)
  if (window.location.hash.includes('access_token')) {
    var hashParams = {};
    window.location.hash.substring(1).split('&').forEach(function(p){
      var kv=p.split('='); hashParams[kv[0]]=decodeURIComponent(kv[1]||'');
    });
    if (hashParams.type === 'recovery') {
      window.history.replaceState({}, document.title, window.location.pathname);
      showNewPasswordForm(hashParams.access_token);
    }
  }
})();

var _resetToken = null;

function saveNewPasswordFromForm() {
  saveNewPassword(_resetToken);
}

function showNewPasswordForm(token) {
  _resetToken = token;
  // Cacher le formulaire de login
  var loginBox = document.querySelector('.login-box') || document.querySelector('form') || document.body.firstElementChild;
  
  // Créer le formulaire nouveau mdp
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(10,10,10,.95);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;';
  overlay.innerHTML = 
    '<div style="background:var(--card,#141414);border:1px solid var(--border,#222);border-radius:20px;width:100%;max-width:420px;padding:36px;">'
    + '<div style="font-family:sans-serif;font-size:22px;font-weight:800;color:#F4EFE8;margin-bottom:6px;">🔑 Nouveau mot de passe</div>'
    + '<div style="font-size:13px;color:rgba(244,239,232,.5);margin-bottom:24px;">Choisis un nouveau mot de passe pour ton compte MANGEICI.</div>'
    + '<div style="margin-bottom:14px;">'
    +   '<label style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#FF5A1F;display:block;margin-bottom:6px;">Nouveau mot de passe</label>'
    +   '<input id="new-pwd" type="password" placeholder="Minimum 8 caractères" style="width:100%;background:#1C1C1C;border:1px solid #222;color:#F4EFE8;font-size:14px;padding:12px 14px;border-radius:8px;outline:none;box-sizing:border-box;">'
    + '</div>'
    + '<div style="margin-bottom:20px;">'
    +   '<label style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#FF5A1F;display:block;margin-bottom:6px;">Confirmer</label>'
    +   '<input id="confirm-pwd" type="password" placeholder="Répète le mot de passe" style="width:100%;background:#1C1C1C;border:1px solid #222;color:#F4EFE8;font-size:14px;padding:12px 14px;border-radius:8px;outline:none;box-sizing:border-box;">'
    + '</div>'
    + '<div id="npwd-msg" style="margin-bottom:12px;font-size:13px;"></div>'
    + '<button id="btn-npwd" onclick="saveNewPasswordFromForm()" style="width:100%;background:#FF5A1F;color:white;border:none;font-size:15px;font-weight:700;padding:13px;border-radius:10px;cursor:pointer;">✓ Enregistrer le mot de passe</button>'
    + '</div>';
  document.body.appendChild(overlay);
}

async function saveNewPassword(token) {
  var pwd = document.getElementById('new-pwd').value;
  var conf = document.getElementById('confirm-pwd').value;
  var msg = document.getElementById('npwd-msg');
  var btn = document.getElementById('btn-npwd');
  
  if (pwd.length < 8) { msg.style.color='#f87171'; msg.textContent='⚠️ Minimum 8 caractères'; return; }
  if (pwd !== conf) { msg.style.color='#f87171'; msg.textContent='⚠️ Les mots de passe ne correspondent pas'; return; }
  
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  
  // D'abord établir la session avec le token de récupération
  var { error: sessionError } = await _supabase.auth.setSession({
    access_token: token,
    refresh_token: token
  });
  
  if (sessionError) {
    // Si setSession échoue, essayer updateUser directement
  }
  
  var { error } = await _supabase.auth.updateUser({ password: pwd });
  
  if (error) {
    msg.style.color='#f87171';
    msg.textContent='❌ Erreur: ' + error.message;
    btn.disabled = false; btn.textContent = '✓ Enregistrer le mot de passe';
  } else {
    msg.style.color='#4ade80';
    msg.textContent='✅ Mot de passe modifié ! Redirection…';
    setTimeout(function(){
      window.location.href = 'mangeici-dashboard.html';
    }, 1500);
  }
}



</script>
</body>
</html>
