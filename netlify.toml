# ╔══════════════════════════════════════════════════════════════╗
# ║  MANGEICI — netlify.toml                                     ║
# ║  Sécurité HTTP headers + redirections                        ║
# ╚══════════════════════════════════════════════════════════════╝

[build]
  publish = "."

# ═══ REDIRECTIONS ═══
[[redirects]]
  from = "/"
  to   = "/mangeici-mvp.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ═══ HEADERS DE SÉCURITÉ sur toutes les pages ═══
[[headers]]
  for = "/*"
  [headers.values]
    # Empêche le clickjacking (iframe par d'autres sites)
    X-Frame-Options = "SAMEORIGIN"

    # Empêche le MIME sniffing
    X-Content-Type-Options = "nosniff"

    # Force HTTPS pour 1 an
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Contrôle le referrer
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Désactive les fonctionnalités inutiles
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"

    # XSS Protection (navigateurs anciens)
    X-XSS-Protection = "1; mode=block"

    # Content Security Policy — sources autorisées uniquement
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.fedapay.com https://api.fontshare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://api.fontshare.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://api.fedapay.com https://app.fedapay.com; frame-src https://cdn.fedapay.com https://app.fedapay.com; object-src 'none';"

# ═══ HEADERS spécifiques aux fichiers HTML ═══
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ═══ HEADERS pour assets statiques ═══
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
