<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANGEICI — Mon compte</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--orange:#FF5A1F;--orange-dim:rgba(255,90,31,.14);--orange-border:rgba(255,90,31,.3);--gold:#E8B84B;--black:#080808;--card:#141414;--card2:#1C1C1C;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);--white:#F5EFE6;--muted:rgba(245,239,230,.42);--muted2:rgba(245,239,230,.16);--green:#4ADE80;--green-dim:rgba(74,222,128,.1);--green-border:rgba(74,222,128,.25);--red:#F87171;--font-d:"Clash Display","Syne",sans-serif;--font-b:"Cabinet Grotesk","DM Sans",sans-serif;--radius:20px;--rsm:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--white);font-family:var(--font-b);min-height:100vh}
body::before{content:"";position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");background-size:200px 200px;pointer-events:none;z-index:9999;opacity:.35}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(8,8,8,.88);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--font-d);font-size:21px;font-weight:700;letter-spacing:-.03em;text-decoration:none;color:var(--white);display:flex;align-items:center;gap:9px}
.nav-logo-mark{width:32px;height:32px;background:var(--orange);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 14px rgba(255,90,31,.4)}
.nav-logo em{color:var(--orange);font-style:normal}
.nav-back{font-size:13px;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-back:hover{color:var(--white)}
.page{max-width:860px;margin:0 auto;padding:90px 24px 60px}
/* AUTH */
.auth-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center}
.auth-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border2);border-radius:24px;padding:40px;position:relative;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.5);animation:fadeUp .5s ease both}
.auth-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--orange),var(--gold));opacity:.7}
.auth-logo{display:flex;justify-content:center;margin-bottom:24px}
.auth-logo-mark{width:44px;height:44px;background:var(--orange);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 16px rgba(255,90,31,.4)}
.tabs{display:flex;background:var(--card2);border-radius:100px;padding:4px;margin-bottom:24px}
.tab{flex:1;padding:9px;border-radius:100px;font-family:var(--font-b);font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .25s;text-align:center;border:none;background:none}
.tab.active{background:var(--orange);color:white;box-shadow:0 4px 14px rgba(255,90,31,.3)}
.panel{display:none}.panel.active{display:block}
.field{margin-bottom:14px}
.field label{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:5px}
.field input{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--white);font-family:var(--font-b);font-size:14px;padding:11px 14px;border-radius:10px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:var(--orange-border);box-shadow:0 0 0 3px rgba(255,90,31,.1)}
.field input::placeholder{color:var(--muted2);font-style:italic}
.btn{width:100%;background:var(--orange);color:white;border:none;font-family:var(--font-d);font-size:14px;font-weight:700;padding:13px;border-radius:100px;cursor:pointer;transition:all .25s;box-shadow:0 4px 16px rgba(255,90,31,.3);letter-spacing:.01em}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(255,90,31,.45)}
.msg{padding:11px 14px;border-radius:10px;font-size:13px;margin:10px 0;display:none;line-height:1.5}
.msg.ok{background:var(--green-dim);border:1px solid var(--green-border);color:var(--green);display:block}
.msg.ko{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:var(--red);display:block}
/* DASHBOARD */
.dash-header{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:24px;display:flex;align-items:center;gap:18px;margin-bottom:28px;flex-wrap:wrap}
.dash-avatar{width:56px;height:56px;border-radius:50%;background:var(--orange-dim);border:2px solid var(--orange-border);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:22px;font-weight:700;color:var(--orange);flex-shrink:0}
.dash-name{font-family:var(--font-d);font-size:20px;font-weight:700;letter-spacing:-.01em}
.dash-email{font-size:13px;color:var(--muted);margin-top:3px}
.btn-logout{margin-left:auto;background:var(--card2);border:1px solid var(--border2);color:var(--muted);font-family:var(--font-b);font-size:12px;font-weight:500;padding:9px 18px;border-radius:100px;cursor:pointer;transition:all .2s}
.btn-logout:hover{color:var(--white);border-color:var(--border)}
.section-title{font-family:var(--font-d);font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.favs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:32px}
.fav-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rsm);padding:16px;display:flex;align-items:center;gap:12px;transition:border-color .2s}
.fav-card:hover{border-color:rgba(255,90,31,.2)}
.fav-emoji{font-size:26px}
.fav-name{font-family:var(--font-d);font-size:14px;font-weight:600;margin-bottom:3px}
.fav-zone{font-size:12px;color:var(--muted)}
.fav-remove{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px;line-height:1;transition:color .2s;flex-shrink:0}
.fav-remove:hover{color:var(--red)}
.empty-favs{text-align:center;padding:48px 24px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.empty-favs-icon{font-size:40px;margin-bottom:12px}
.empty-favs-title{font-family:var(--font-d);font-size:17px;font-weight:700;margin-bottom:8px}
.empty-favs-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.btn-outline{display:inline-flex;align-items:center;gap:7px;background:var(--orange);color:white;text-decoration:none;font-family:var(--font-d);font-size:13px;font-weight:700;padding:11px 24px;border-radius:100px;transition:all .2s;box-shadow:0 4px 14px rgba(255,90,31,.3)}
.btn-outline:hover{transform:translateY(-1px)}
.scroll-top{position:fixed;bottom:28px;right:28px;width:44px;height:44px;border-radius:50%;background:var(--orange);border:none;color:white;font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,90,31,.4);z-index:99;transition:all .2s}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:540px){.tabs{flex-direction:column}.dash-header{flex-direction:column;align-items:flex-start}.btn-logout{margin-left:0}}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="mangeici-mvp.html">
    <div class="nav-logo-mark">🍽️</div>
    MANGE<em>ICI</em>
  </a>
  <a class="nav-back" href="mangeici-mvp.html">← Retour au site</a>
</nav>

<div class="page">

  <!-- AUTH -->
  <div class="auth-wrap" id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo"><div class="auth-logo-mark">👤</div></div>
      <div class="tabs">
        <button class="tab active" onclick="switchAuthTab('login',this)">Se connecter</button>
        <button class="tab" onclick="switchAuthTab('signup',this)">Créer un compte</button>
      </div>
      <div class="panel active" id="auth-login">
        <div class="msg" id="login-msg2"></div>
        <div class="field"><label>Email</label><input type="email" id="c-email" placeholder="ton@email.com"></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="c-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth('login')"></div>
        <button class="btn" onclick="doAuth('login')">Se connecter →</button>
      </div>
      <div class="panel" id="auth-signup">
        <div class="msg" id="signup-msg"></div>
        <div class="field"><label>Prénom</label><input type="text" id="c-prenom" placeholder="Ton prénom"></div>
        <div class="field"><label>Email</label><input type="email" id="c-email2" placeholder="ton@email.com"></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="c-pass2" placeholder="8 caractères min" onkeydown="if(event.key==='Enter')doAuth('signup')"></div>
        <button class="btn" onclick="doAuth('signup')">Créer mon compte →</button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="client-dashboard" style="display:none">
    <div class="dash-header">
      <div class="dash-avatar" id="c-avatar">?</div>
      <div>
        <div class="dash-name" id="c-name">—</div>
        <div class="dash-email" id="c-email-disp">—</div>
      </div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>

    <div class="section-title">❤️ Mes restaurants favoris</div>
    <div id="favs-grid" class="favs-grid"></div>

    <div class="empty-favs" id="favs-empty" style="display:none">
      <div class="empty-favs-icon">🤍</div>
      <div class="empty-favs-title">Aucun favori pour l'instant</div>
      <div class="empty-favs-sub">Clique sur ❤️ sur une fiche restaurant pour l'ajouter ici. Retrouve tes restos préférés en un clin d'œil.</div>
      <a href="mangeici-mvp.html" class="btn-outline">🍽️ Découvrir des restaurants</a>
    </div>
  </div>

</div>

<button class="scroll-top" id="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>

const SUPA_URL = "https://ldcweouzknksuudvroqu.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkY3dlb3V6a25rc3V1ZHZyb3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMDA0NjAsImV4cCI6MjA5MTY3NjQ2MH0.vyCqou8IAugFszrizK0eVRu3G2HylNKZmEp8vn0oKoE";
const { createClient } = supabase;
const db = createClient(SUPA_URL, SUPA_KEY);
var CLIENT_ID = null;

// Check session
db.auth.getSession().then(function(r) {
  if (r.data.session) showDashboard(r.data.session.user);
});

function showAuthTab(tab, el) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('tab-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('tab-signup').style.display = tab === 'signup' ? 'block' : 'none';
}

async function doAuth(type) {
  var msgId = type === 'login' ? 'auth-msg' : 'auth-msg2';
  var msg = document.getElementById(msgId);
  msg.className = 'msg';

  if (type === 'login') {
    var email = document.getElementById('c-email').value.trim();
    var pass  = document.getElementById('c-pass').value;
    var r = await db.auth.signInWithPassword({email, password: pass});
    if (r.error) { msg.className='msg ko'; msg.textContent='❌ '+r.error.message; return; }
    showDashboard(r.data.user);
  } else {
    var prenom = document.getElementById('c-prenom').value.trim();
    var email2 = document.getElementById('c-email2').value.trim();
    var pass2  = document.getElementById('c-pass2').value;
    if (!prenom) { msg.className='msg ko'; msg.textContent='⚠️ Indique ton prénom.'; return; }
    if (pass2.length < 8) { msg.className='msg ko'; msg.textContent='⚠️ Mot de passe trop court.'; return; }
    var r = await db.auth.signUp({email: email2, password: pass2, options: {data:{prenom}}});
    if (r.error) { msg.className='msg ko'; msg.textContent='❌ '+r.error.message; return; }
    msg.className='msg ok'; msg.textContent='✅ Compte créé ! Vérifie ta boîte mail.';
    setTimeout(function() { if(r.data.user) showDashboard(r.data.user); }, 1500);
  }
}

async function showDashboard(user) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('client-dashboard').style.display = 'block';
  CLIENT_ID = user.id;
  var prenom = user.user_metadata?.prenom || user.email.split('@')[0];
  document.getElementById('c-avatar').textContent = prenom[0].toUpperCase();
  document.getElementById('c-name').textContent = prenom;
  document.getElementById('c-email-display').textContent = user.email;
  await loadFavoris();
}

async function loadFavoris() {
  // Load from localStorage (no login required)
  var localFavs = JSON.parse(localStorage.getItem('mangeici_favs') || '[]');
  var allFavs = localFavs;
  
  // Also load from Supabase if logged in
  if (CLIENT_ID) {
    var resp = await fetch(SUPA_URL+"/rest/v1/favoris?client_id=eq."+CLIENT_ID+"&select=*,restaurants(id,nom,zone,cuisine,plan)", {
      headers: {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}
    });
    var data = await resp.json();
    if (Array.isArray(data)) {
      data.forEach(function(f) { if(f.restaurants && allFavs.indexOf(f.restaurants.id)===-1) allFavs.push(f.restaurants.id); });
    }
  }
  
  if (!allFavs.length) {
    document.getElementById('favs-grid').innerHTML = '<div class="empty-favs" style="grid-column:1/-1">Aucun restaurant favori. Clique sur ❤️ sur une fiche restaurant pour l\'ajouter ici !</div>';
    return;
  }
  
  // Load restaurant details
  var ids = allFavs.map(function(id){return '"'+id+'"';}).join(',');
  var resp2 = await fetch(SUPA_URL+"/rest/v1/restaurants?id=in.("+ids+")&select=id,nom,zone,cuisine,plan&statut=eq.actif", {
    headers: {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}
  });
  var restos = await resp2.json();
  if (!Array.isArray(restos) || !restos.length) {
    document.getElementById('favs-grid').innerHTML = '<div class="empty-favs" style="grid-column:1/-1">Aucun restaurant trouvé.</div>';
    return;
  }
  
  var CEMOJI = {"Cuisine béninoise":"🍛","Grillades":"🔥","Asiatique":"🍜","Fast-food":"🍔"};
  var html = '';
  restos.forEach(function(r) {
    var emoji = CEMOJI[(r.cuisine||[])[0]] || '🍽️';
    html += '<div class="fav-card">'
      + '<div class="fav-emoji">'+emoji+'</div>'
      + '<div><div class="fav-name">'+r.nom+'</div><div class="fav-zone">📍 '+r.zone+'</div></div>'
      + '<button class="fav-remove" onclick="removeFav(\''+r.id+'\')">×</button>'
      + '</div>';
  });
  document.getElementById('favs-grid').innerHTML = html;
}

function removeFav(id) {
  var favs = JSON.parse(localStorage.getItem('mangeici_favs') || '[]');
  favs = favs.filter(function(f){return f!==id;});
  localStorage.setItem('mangeici_favs', JSON.stringify(favs));
  loadFavoris();
}


async function removeFavori(id) {
  await fetch(SUPA_URL+"/rest/v1/favoris?id=eq."+id, {
    method: 'DELETE',
    headers: {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}
  });
  loadFavoris();
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}


function switchAuthTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('auth-login').classList.toggle('active', tab === 'login');
  document.getElementById('auth-signup').classList.toggle('active', tab === 'signup');
}
window.addEventListener('scroll', function(){
  var b = document.getElementById('scroll-top-btn');
  if(b) b.style.display = window.scrollY > 300 ? 'flex' : 'none';
});

</script>
</body>
</html>
