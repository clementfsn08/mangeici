<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MANGEICI — Mon compte</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FAFAF7;--cream:#F5F0E8;--sand:#EDE8DF;--sand-2:#E2DDD3;
  --stone:#D4CFC4;--warm-gray:#9C978E;--dark:#2C2A26;--dark-2:#4A4740;--ink:#1A1816;
  --orange:#E85D20;--orange-light:rgba(232,93,32,.1);--orange-border:rgba(232,93,32,.25);
  --gold:#C4933A;--gold-light:rgba(196,147,58,.12);
  --green:#3A7D44;--green-light:rgba(58,125,68,.1);--green-border:rgba(58,125,68,.25);
  --red:#C0392B;--red-light:rgba(192,57,43,.1);--red-border:rgba(192,57,43,.25);
  --font-d:'Playfair Display',Georgia,serif;
  --font-b:'Plus Jakarta Sans',system-ui,sans-serif;
  --shadow-sm:0 1px 3px rgba(44,42,38,.08),0 4px 12px rgba(44,42,38,.06);
  --shadow:0 4px 16px rgba(44,42,38,.1),0 12px 40px rgba(44,42,38,.08);
  --shadow-lg:0 8px 32px rgba(44,42,38,.12),0 32px 80px rgba(44,42,38,.1);
  --radius:18px;--rsm:10px;--rxs:7px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--dark);font-family:var(--font-b);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--orange);color:white}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--sand)}
::-webkit-scrollbar-thumb{background:var(--stone);border-radius:3px}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(250,250,247,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--sand-2)}
.nav-logo{font-family:var(--font-d);font-size:21px;font-weight:700;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:9px}
.nav-logo-mark{width:32px;height:32px;background:var(--orange);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 3px 10px rgba(232,93,32,.3)}
.nav-logo em{color:var(--orange);font-style:normal}
.nav-back{font-size:13px;color:var(--warm-gray);text-decoration:none;transition:color .2s;display:flex;align-items:center;gap:5px}
.nav-back:hover{color:var(--orange)}
.field{margin-bottom:16px}
.field label{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--cream);border:1px solid var(--sand-2);color:var(--dark);font-family:var(--font-b);font-size:14px;font-weight:400;padding:12px 15px;border-radius:var(--rxs);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{background:white;border-color:var(--orange-border);box-shadow:0 0 0 3px rgba(232,93,32,.08)}
.field input::placeholder,.field textarea::placeholder{color:var(--stone);font-style:italic}
.field textarea{min-height:100px;resize:vertical;line-height:1.6}
.btn{background:var(--orange);color:white;border:none;font-family:var(--font-b);font-size:14px;font-weight:700;padding:13px 24px;border-radius:100px;cursor:pointer;transition:all .25s;box-shadow:0 3px 12px rgba(232,93,32,.3);letter-spacing:.01em}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 18px rgba(232,93,32,.42)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{padding:12px 16px;border-radius:var(--rxs);font-size:13px;margin:10px 0;display:none;line-height:1.5}
.msg.ok{background:var(--green-light);border:1px solid var(--green-border);color:var(--green);display:block}
.msg.ko{background:var(--red-light);border:1px solid var(--red-border);color:var(--red);display:block}
.scroll-top{position:fixed;bottom:28px;right:28px;width:42px;height:42px;border-radius:50%;background:var(--ink);border:none;color:var(--ivory);font-size:17px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:99;transition:all .2s}
.scroll-top:hover{background:var(--orange);transform:translateY(-2px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s ease}
.reveal.vis{opacity:1;transform:translateY(0)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:var(--cream)}
.page{max-width:860px;margin:0 auto;padding:88px 24px 60px}
.auth-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center}
.auth-card{width:100%;max-width:420px;background:white;border:1px solid var(--sand-2);border-radius:24px;padding:40px;box-shadow:var(--shadow-lg);animation:fadeUp .5s ease both;position:relative;overflow:hidden}
.auth-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--orange),var(--gold))}
.auth-logo{display:flex;justify-content:center;margin-bottom:24px}
.auth-logo-mark{width:44px;height:44px;background:var(--orange);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 12px rgba(232,93,32,.3)}
.tabs{display:flex;background:var(--cream);border-radius:100px;padding:4px;margin-bottom:22px;border:1px solid var(--sand-2)}
.tab{flex:1;padding:9px;border-radius:100px;font-family:var(--font-b);font-size:13px;font-weight:600;cursor:pointer;color:var(--warm-gray);transition:all .25s;text-align:center;border:none;background:none}
.tab.active{background:var(--orange);color:white;box-shadow:0 3px 10px rgba(232,93,32,.28)}
.panel{display:none}.panel.active{display:block}
.btn-full{width:100%}
.btn-ghost{width:100%;background:transparent;border:1px solid var(--sand-2);color:var(--warm-gray);font-family:var(--font-b);font-size:13px;font-weight:500;padding:12px;border-radius:100px;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-ghost:hover{border-color:var(--orange-border);color:var(--orange)}
.dash-header{background:white;border:1px solid var(--sand-2);border-radius:var(--radius);padding:22px;display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
.dash-avatar{width:52px;height:52px;border-radius:50%;background:var(--orange-light);border:2px solid var(--orange-border);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:20px;font-weight:700;color:var(--orange);flex-shrink:0}
.dash-name{font-family:var(--font-d);font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.dash-email{font-size:13px;color:var(--warm-gray);margin-top:3px}
.btn-logout{margin-left:auto;background:var(--cream);border:1px solid var(--sand-2);color:var(--warm-gray);font-family:var(--font-b);font-size:12px;font-weight:500;padding:9px 18px;border-radius:100px;cursor:pointer;transition:all .2s}
.btn-logout:hover{border-color:var(--red-border);color:var(--red)}
.section-title{font-family:var(--font-d);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-bottom:16px}
.favs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:28px}
.fav-card{background:white;border:1px solid var(--sand-2);border-radius:var(--rsm);padding:14px;display:flex;align-items:center;gap:11px;transition:border-color .2s,box-shadow .2s;box-shadow:var(--shadow-sm)}
.fav-card:hover{border-color:rgba(232,93,32,.2);box-shadow:var(--shadow)}
.fav-emoji{font-size:24px}
.fav-name{font-family:var(--font-d);font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px}
.fav-zone{font-size:12px;color:var(--warm-gray)}
.fav-remove{margin-left:auto;background:none;border:none;color:var(--stone);font-size:18px;cursor:pointer;padding:4px;line-height:1;transition:color .2s;flex-shrink:0}
.fav-remove:hover{color:var(--red)}
.empty-favs{background:white;border:1px solid var(--sand-2);border-radius:var(--radius);padding:48px 24px;text-align:center;box-shadow:var(--shadow-sm)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-family:var(--font-d);font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px}
.empty-sub{font-size:13px;color:var(--warm-gray);margin-bottom:20px;line-height:1.6}
.btn-discover{display:inline-flex;align-items:center;gap:7px;background:var(--orange);color:white;text-decoration:none;font-family:var(--font-b);font-size:13px;font-weight:700;padding:11px 24px;border-radius:100px;transition:all .2s;box-shadow:0 3px 12px rgba(232,93,32,.28)}
.btn-discover:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(232,93,32,.4)}
@media(max-width:540px){.dash-header{flex-direction:column;align-items:flex-start}.btn-logout{margin-left:0}}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="mangeici-mvp.html"><div class="nav-logo-mark">🍽️</div>MANGE<em>ICI</em></a>
  <a class="nav-back" href="mangeici-mvp.html">← Retour au site</a>
</nav>
<div class="page">
  <div class="auth-wrap" id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo"><div class="auth-logo-mark">👤</div></div>
      <div class="tabs">
        <button class="tab active" onclick="switchAuthTab('login',this)">Se connecter</button>
        <button class="tab" onclick="switchAuthTab('signup',this)">Créer un compte</button>
      </div>
      <div class="panel active" id="auth-login">
        <div class="msg" id="login-msg2"></div>
        <div class="field"><label>Email</label><input type="email" id="c-email" placeholder="ton@email.com"></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="c-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth('login')"></div>
        <button class="btn btn-full" onclick="doAuth('login')">Se connecter →</button>
      </div>
      <div class="panel" id="auth-signup">
        <div class="msg" id="signup-msg"></div>
        <div class="field"><label>Prénom</label><input type="text" id="c-prenom" placeholder="Ton prénom"></div>
        <div class="field"><label>Email</label><input type="email" id="c-email2" placeholder="ton@email.com"></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="c-pass2" placeholder="8 caractères min" onkeydown="if(event.key==='Enter')doAuth('signup')"></div>
        <button class="btn btn-full" onclick="doAuth('signup')">Créer mon compte →</button>
      </div>
    </div>
  </div>
  <div id="client-dashboard" style="display:none">
    <div class="dash-header">
      <div class="dash-avatar" id="c-avatar">?</div>
      <div><div class="dash-name" id="c-name">—</div><div class="dash-email" id="c-email-disp">—</div></div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
    <div class="section-title">❤️ Mes restaurants favoris</div>
    <div id="favs-grid" class="favs-grid"></div>
    <div class="empty-favs" id="favs-empty" style="display:none">
      <div class="empty-icon">🤍</div>
      <div class="empty-title">Aucun favori pour l'instant</div>
      <div class="empty-sub">Clique sur ❤️ sur une fiche restaurant pour l'ajouter ici.</div>
      <a href="mangeici-mvp.html" class="btn-discover">🍽️ Découvrir des restaurants</a>
    </div>
  </div>
</div>
<button class="scroll-top" id="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>


const SUPA_URL = "https://ldcweouzknksuudvroqu.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkY3dlb3V6a25rc3V1ZHZyb3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMDA0NjAsImV4cCI6MjA5MTY3NjQ2MH0.vyCqou8IAugFszrizK0eVRu3G2HylNKZmEp8vn0oKoE";
const { createClient } = supabase;
const db = createClient(SUPA_URL, SUPA_KEY);
var CLIENT_ID = null;

// Check session
db.auth.getSession().then(function(r) {
  if (r.data.session) showDashboard(r.data.session.user);
});

function showAuthTab(tab, el) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('tab-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('tab-signup').style.display = tab === 'signup' ? 'block' : 'none';
}

async function doAuth(type) {
  var msgId = type === 'login' ? 'auth-msg' : 'auth-msg2';
  var msg = document.getElementById(msgId);
  msg.className = 'msg';

  if (type === 'login') {
    var email = document.getElementById('c-email').value.trim();
    var pass  = document.getElementById('c-pass').value;
    var r = await db.auth.signInWithPassword({email, password: pass});
    if (r.error) { msg.className='msg ko'; msg.textContent='❌ '+r.error.message; return; }
    showDashboard(r.data.user);
  } else {
    var prenom = document.getElementById('c-prenom').value.trim();
    var email2 = document.getElementById('c-email2').value.trim();
    var pass2  = document.getElementById('c-pass2').value;
    if (!prenom) { msg.className='msg ko'; msg.textContent='⚠️ Indique ton prénom.'; return; }
    if (pass2.length < 8) { msg.className='msg ko'; msg.textContent='⚠️ Mot de passe trop court.'; return; }
    var r = await db.auth.signUp({email: email2, password: pass2, options: {data:{prenom}}});
    if (r.error) { msg.className='msg ko'; msg.textContent='❌ '+r.error.message; return; }
    msg.className='msg ok'; msg.textContent='✅ Compte créé ! Vérifie ta boîte mail.';
    setTimeout(function() { if(r.data.user) showDashboard(r.data.user); }, 1500);
  }
}

async function showDashboard(user) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('client-dashboard').style.display = 'block';
  CLIENT_ID = user.id;
  var prenom = user.user_metadata?.prenom || user.email.split('@')[0];
  document.getElementById('c-avatar').textContent = prenom[0].toUpperCase();
  document.getElementById('c-name').textContent = prenom;
  document.getElementById('c-email-display').textContent = user.email;
  await loadFavoris();
}

async function loadFavoris() {
  // Load from localStorage (no login required)
  var localFavs = JSON.parse(localStorage.getItem('mangeici_favs') || '[]');
  var allFavs = localFavs;
  
  // Also load from Supabase if logged in
  if (CLIENT_ID) {
    var resp = await fetch(SUPA_URL+"/rest/v1/favoris?client_id=eq."+CLIENT_ID+"&select=*,restaurants(id,nom,zone,cuisine,plan)", {
      headers: {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}
    });
    var data = await resp.json();
    if (Array.isArray(data)) {
      data.forEach(function(f) { if(f.restaurants && allFavs.indexOf(f.restaurants.id)===-1) allFavs.push(f.restaurants.id); });
    }
  }
  
  if (!allFavs.length) {
    document.getElementById('favs-grid').innerHTML = '<div class="empty-favs" style="grid-column:1/-1">Aucun restaurant favori. Clique sur ❤️ sur une fiche restaurant pour l\'ajouter ici !</div>';
    return;
  }
  
  // Load restaurant details
  var ids = allFavs.map(function(id){return '"'+id+'"';}).join(',');
  var resp2 = await fetch(SUPA_URL+"/rest/v1/restaurants?id=in.("+ids+")&select=id,nom,zone,cuisine,plan&statut=eq.actif", {
    headers: {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}
  });
  var restos = await resp2.json();
  if (!Array.isArray(restos) || !restos.length) {
    document.getElementById('favs-grid').innerHTML = '<div class="empty-favs" style="grid-column:1/-1">Aucun restaurant trouvé.</div>';
    return;
  }
  
  var CEMOJI = {"Cuisine béninoise":"🍛","Grillades":"🔥","Asiatique":"🍜","Fast-food":"🍔"};
  var html = '';
  restos.forEach(function(r) {
    var emoji = CEMOJI[(r.cuisine||[])[0]] || '🍽️';
    html += '<div class="fav-card">'
      + '<div class="fav-emoji">'+emoji+'</div>'
      + '<div><div class="fav-name">'+r.nom+'</div><div class="fav-zone">📍 '+r.zone+'</div></div>'
      + '<button class="fav-remove" onclick="removeFav(\''+r.id+'\')">×</button>'
      + '</div>';
  });
  document.getElementById('favs-grid').innerHTML = html;
}

function removeFav(id) {
  var favs = JSON.parse(localStorage.getItem('mangeici_favs') || '[]');
  favs = favs.filter(function(f){return f!==id;});
  localStorage.setItem('mangeici_favs', JSON.stringify(favs));
  loadFavoris();
}


async function removeFavori(id) {
  await fetch(SUPA_URL+"/rest/v1/favoris?id=eq."+id, {
    method: 'DELETE',
    headers: {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}
  });
  loadFavoris();
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}


function switchAuthTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('auth-login').classList.toggle('active', tab === 'login');
  document.getElementById('auth-signup').classList.toggle('active', tab === 'signup');
}
window.addEventListener('scroll', function(){
  var b = document.getElementById('scroll-top-btn');
  if(b) b.style.display = window.scrollY > 300 ? 'flex' : 'none';
});


function switchAuthTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('auth-login').classList.toggle('active', tab==='login');
  document.getElementById('auth-signup').classList.toggle('active', tab==='signup');
}
window.addEventListener('scroll',function(){
  var b=document.getElementById('scroll-top-btn');
  if(b) b.style.display=window.scrollY>300?'flex':'none';
});
</script>
</body>
</html>
